name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/beratr061/ferrodock

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Require release signing configuration
        env:
          PUBLIC_KEY: ${{ vars.FERRODOCK_RELEASE_PUBLIC_KEY }}
          SIGNING_KEY: ${{ secrets.FERRODOCK_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$PUBLIC_KEY" ] || { echo "set the FERRODOCK_RELEASE_PUBLIC_KEY repository variable"; exit 1; }
          [ -n "$SIGNING_KEY" ] || { echo "set the FERRODOCK_RELEASE_SIGNING_KEY repository secret"; exit 1; }
      - uses: actions/checkout@v5
      - id: meta
        name: Check tag matches the crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"$" Cargo.toml || { echo "tag ${GITHUB_REF_NAME} does not match the workspace version in Cargo.toml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FERRODOCK_RELEASE_PUBLIC_KEY=${{ vars.FERRODOCK_RELEASE_PUBLIC_KEY }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  assets:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version and pinned image digest
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="${IMAGE}@${{ needs.image.outputs.digest }}"
          mkdir -p out
          sed -e "s|^FERRODOCK_VERSION=.*|FERRODOCK_VERSION=\"\${FERRODOCK_VERSION:-${version}}\"|" \
              -e "s|^FERRODOCK_IMAGE=.*|FERRODOCK_IMAGE=\"\${FERRODOCK_IMAGE:-${image}}\"|" \
              deploy/install.sh > out/install.sh
          cp deploy/uninstall.sh out/uninstall.sh
          cp deploy/docker-compose.yml out/docker-compose.yml
          cp deploy/traefik/traefik.yml out/traefik-traefik.yml
          cp deploy/traefik/dynamic/panel.yml out/traefik-dynamic-panel.yml
      - name: Sign release manifest
        env:
          SQLX_OFFLINE: "true"
          FERRODOCK_RELEASE_SIGNING_KEY: ${{ secrets.FERRODOCK_RELEASE_SIGNING_KEY }}
        run: |
          cargo xtask sign-manifest "$GITHUB_REF_NAME" "${{ needs.image.outputs.digest }}" out/manifest.json
          (cd out && sha256sum * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes --verify-tag
