name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: ferrodock
          POSTGRES_PASSWORD: ferrodock-ci
          POSTGRES_DB: ferrodock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrodock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ferrodock:ferrodock-ci@localhost:5432/ferrodock
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check-rules
      - run: cargo test --workspace
      - name: sqlx offline data is current
        run: |
          cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          sqlx migrate run --source crates/db/migrations/postgres
          SQLX_OFFLINE=false cargo sqlx prepare --workspace --check -- --all-targets
      - name: openapi contract is current
        run: |
          cargo run -q -p ferrodock -- openapi > openapi.generated.json
          diff -u openapi.json openapi.generated.json

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

  image:
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ferrodock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install the built image
        run: sudo FERRODOCK_IMAGE=ferrodock:ci FERRODOCK_LOCAL_ASSETS="$GITHUB_WORKSPACE/deploy" sh deploy/install.sh
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: End-to-end tests
        working-directory: web
        env:
          FD_E2E_URL: http://127.0.0.1:3000
        run: |
          token="$(sudo cat /etc/ferrodock/setup-token)"
          echo "::add-mask::$token"
          FD_SETUP_TOKEN="$token" pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: web/test-results
          retention-days: 7
